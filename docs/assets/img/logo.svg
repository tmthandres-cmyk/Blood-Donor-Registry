<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="LifeLine blood drop logo">
  <defs>
    <linearGradient id="llDrop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0344f"/>
      <stop offset="100%" stop-color="#8f0b20"/>
    </linearGradient>
    <linearGradient id="llPulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdeaed"/>
    </linearGradient>
  </defs>

  <!-- Drop shield -->
  <path fill="url(#llDrop)" d="M32 3C32 3 9 26.5 9 39.5C9 51.2 19.3 60 32 60s23-8.8 23-20.5C55 26.5 32 3 32 3z"/>

  <!-- Highlight -->
  <path fill="#ffffff" opacity="0.16" d="M22 24c-5 6-8 11-8 15.5 0 3.6 1.3 6.6 3.5 9 1-7.5 3.6-14.5 8-21-1.2-1.7-2.3-2.8-3.5-3.5z"/>

  <!-- Pulse line across the drop -->
  <path fill="none" stroke="url(#llPulse)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"
        d="M13 40h8l4-9 6 18 5-12 3 3h12"/>
</svg>