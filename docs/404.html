<script>
  // GitHub Pages serves this page for any missing path, so the URL the visitor
  // sees is the one they asked for - not the folder holding 404.html. The app
  // root therefore has to be discovered rather than assumed, because a project
  // repo lives at /repo/ while a user site lives at /.
  (function () {
    var segments = location.pathname.split('/').filter(Boolean);

    function tryBase(index) {
      if (index < 0) {
        // Nothing resolved; fall back to the root of the host.
        location.replace('/');
        return;
      }
      var candidate = '/' + segments.slice(0, index).join('/') + '/';
      // Try the deepest candidate first: a missing file under the repo folder
      // should resolve to that same folder.
      fetch(candidate + 'index.html', { method: 'HEAD', cache: 'no-store' })
        .then(function (res) {
          if (res.ok) location.replace(candidate + '#/');
          else tryBase(index - 1);
        })
        .catch(function () { tryBase(index - 1); });
    }

    var links = document.querySelectorAll('[data-home]');
    for (var i = 0; i < links.length; i++) {
      links[i].addEventListener('click', function (e) { e.preventDefault(); tryBase(segments.length); });
    }

    // Send them into the app straight away.
    setTimeout(function () { tryBase(segments.length); }, 350);
  })();
</script>
